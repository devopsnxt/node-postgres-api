name-template: 'Release $RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  - title: '🛠 Dependency Updates'
    labels:
      - 'dependencies'
  - title: '🧰 Maintenance & Refactoring'
    labels:
      - 'chore'
      - 'refactor'
      - 'tests'
      - 'maintenance'

exclude-labels:
  - 'ignore-for-release'

autolabeler:
  - label: 'feature'
    title:
      - '/^feat:/i'
      - '/^feature:/i'
      - '/^\(feat\):/i'
      - '/^\(feature\):/i'
  - label: 'bug'
    title:
      - '/^fix:/i'
      - '/^bug:/i'
      - '/^\(bug\):/i'
      - '/^\(fix\):/i'
  - label: 'documentation'
    title:
      - '/^docs:/i'
      - '/^\(docs\):/i'
  - label: 'chore'
    title:
      - '/^chore:/i'
      - '/^refactor:/i'
      - '/^\(chore\):/i'
      - '/^\(refactor\):/i'
