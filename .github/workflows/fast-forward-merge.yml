---
name: fast-forward-merge

on:
  push:
    branches:
      - main

concurrency:
  group: node-postgres-api-main
  cancel-in-progress: true

env:
  APP_NAME: node-postgres-api
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/node-postgres-api

jobs:
  fast-forward-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    env:
      AI_ENABLED: ${{ secrets.AI_API_KEY != '' && true || false }}

    steps:

      # ── Checkout ──────────────────────────────────────────────
      #   Clones the repository so the pipeline can access the code.

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # ── Shared CI Checks ──────────────────────────────────────
      #   Calls the reusable composite action to run all linting,
      #   tests, and scans. Also loads the Docker image locally.

      - name: CI Checks
        id: ci
        uses: ./.github/actions/ci-checks
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          sonar-organization: ${{ vars.SONAR_ORGANIZATION }}
          sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          docker-load: "true"
          docker-tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:latest

      # ── GHCR Login & Push ─────────────────────────────────────
      #   Authenticates to GitHub Container Registry and pushes
      #   the built Docker image with both SHA and 'latest' tags.

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Images
        run: |
          docker push ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          docker push ${{ env.GHCR_IMAGE }}:latest

      # ── Cosign Sign & Attest ──────────────────────────────────
      #   Cryptographically signs the Docker image and attaches the
      #   SBOM to guarantee its authenticity and integrity.

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1

      - name: Sign GHCR Image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_YES: "true"
        run: |
          cosign public-key \
            --key env://COSIGN_PRIVATE_KEY \
            > cosign.pub

          IMAGE_DIGEST=$(docker buildx imagetools inspect \
            "${{ env.GHCR_IMAGE }}:${{ github.sha }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV

          IMAGE_REF="${{ env.GHCR_IMAGE }}@$IMAGE_DIGEST"

          cosign sign \
            --key env://COSIGN_PRIVATE_KEY \
            "$IMAGE_REF"

      - name: Attach SBOM Attestation
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_YES: "true"
        run: |
          IMAGE_REF="${{ env.GHCR_IMAGE }}@${IMAGE_DIGEST}"

          cosign attest \
            --key env://COSIGN_PRIVATE_KEY \
            --predicate image-sbom.json \
            "$IMAGE_REF"

      - name: Verify Signature and Attestation
        run: |
          IMAGE_REF="${{ env.GHCR_IMAGE }}@${IMAGE_DIGEST}"

          cosign verify \
            --key cosign.pub \
            "$IMAGE_REF"

          cosign verify-attestation \
            --key cosign.pub \
            "$IMAGE_REF"

      # ── Pipeline Summary ──────────────────────────────────────
      #   Writes a high-level markdown summary of the release build
      #   directly to the GitHub Actions workflow summary page.

      - name: Generate Pipeline Summary
        if: always()
        run: |
          {
            echo "## Release Pipeline"
            echo ""
            echo "| Area | Result |"
            echo "|------|--------|"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Image | ${{ env.GHCR_IMAGE }} |"
            echo "| Digest | ${IMAGE_DIGEST} |"
            echo "| Critical | ${{ steps.ci.outputs.critical }} |"
            echo "| High | ${{ steps.ci.outputs.high }} |"
            echo "| Unfixed | ${{ steps.ci.outputs.unfixed }} |"
            echo "| SBOM Components | ${{ steps.ci.outputs.components }} |"
            echo "| Signature | Verified |"
            echo "| Attestation | Verified |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── AI Release Assessment ─────────────────────────────────
      #   Uses AI to analyze all commits pushed to 'main' since the
      #   last run, assessing risks before potential production deployment.

      - name: Generate AI Release Report
        id: ai-release
        if: ${{ env.AI_ENABLED == 'true' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          changed_files=$(git diff --name-only "$BASE_SHA...$GITHUB_SHA")

          diff=$(git diff \
            "$BASE_SHA...$GITHUB_SHA" \
            -- . ':!package-lock.json' ':!*.lock')

          critical="${{ steps.ci.outputs.critical }}"
          high="${{ steps.ci.outputs.high }}"
          components="${{ steps.ci.outputs.components }}"

          prompt=$(cat <<EOF
          You are a Release Engineer.

          Assess release readiness.

          Repository Changes

          $changed_files

          Diff

          $diff

          Security

          Critical Vulnerabilities : $critical

          High Vulnerabilities : $high

          SBOM Components : $components

          Return

          - Summary
          - Risks
          - Rollback Recommendation
          - Production Readiness
          EOF
          )

          response=$(curl \
            -s \
            -H "Authorization: Bearer $AI_API_KEY" \
            -H "Content-Type: application/json" \
            "$AI_API_URL" \
            -d "$(jq -n \
            --arg model "$AI_MODEL" \
            --arg prompt "$prompt" \
            '{
                model:$model,
                messages:[
                  {
                    role:"user",
                    content:$prompt
                  }
                ]
            }')")

          report=$(echo "$response" \
            | jq -r '.choices[0].message.content')

          {
            echo ""
            echo "## AI Release Assessment"
            echo ""
            echo "$report"
          } >> "$GITHUB_STEP_SUMMARY"
