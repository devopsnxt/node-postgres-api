---
name: pull-request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: node-postgres-api-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: node-postgres-api
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/node-postgres-api

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
      security-events: write
    env:
      AI_ENABLED: ${{ secrets.AI_API_KEY != '' && true || false }}

    steps:

      # ── Checkout ──────────────────────────────────────────────
      #   Clones the repository so the pipeline can access the code.

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # ── Shared CI Checks ──────────────────────────────────────
      #   Calls the reusable composite action to run linting, tests,
      #   CodeQL, SonarCloud, Docker build, SBOM, and Trivy scans.

      - name: CI Checks
        id: ci
        uses: ./.github/actions/ci-checks
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          sonar-host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          sonar-organization: ${{ vars.SONAR_ORGANIZATION }}
          sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          docker-tags: ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      # ── Gitleaks Artifact (PR-only) ───────────────────────────
      #   Uploads the secret scanning SARIF report as a workflow
      #   artifact for manual review if needed.

      - name: Upload Gitleaks Artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

      # ── Pipeline Summary ──────────────────────────────────────
      #   Writes a high-level markdown summary of the CI findings
      #   directly to the GitHub Actions workflow summary page.

      - name: Generate Pipeline Summary
        if: always()
        run: |
          {
            echo "## Pull Request Validation"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Critical | ${{ steps.ci.outputs.critical }} |"
            echo "| High | ${{ steps.ci.outputs.high }} |"
            echo "| Unfixed | ${{ steps.ci.outputs.unfixed }} |"
            echo "| SBOM Components | ${{ steps.ci.outputs.components }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── AI Review ─────────────────────────────────────────────
      #   Uses an AI model (if enabled) to review the exact code
      #   changes in this PR for logic bugs and security flaws.

      - name: AI Review
        id: ai-review
        if: ${{ env.AI_ENABLED == 'true' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          changed_files=$(git diff --name-only "$BASE_SHA...$GITHUB_SHA")

          prompt=$(cat <<EOF
          Review the changed files.

          Focus on:
          - Bugs
          - Security
          - Authentication
          - SQL Injection
          - Secrets
          - Docker
          - GitHub Actions
          - Validation
          - API Risks

          Changed Files:
          $changed_files
          EOF
          )

          response=$(curl \
            --silent \
            --show-error \
            --header "Authorization: Bearer $AI_API_KEY" \
            --header "Content-Type: application/json" \
            "$AI_API_URL" \
            --data "$(jq -n \
              --arg model "$AI_MODEL" \
              --arg prompt "$prompt" \
              '{
                model: $model,
                messages: [
                  {
                    role: "user",
                    content: $prompt
                  }
                ]
              }')")

          report=$(echo "$response" | jq -r '.choices[0].message.content // "No AI review available."')

          {
            echo "report<<EOF"
            echo "$report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## AI Review"
            echo
            echo "$report"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── PR Comment ────────────────────────────────────────────
      #   Posts the scan metrics and AI review report as a comment
      #   directly on the Pull Request thread.

      - name: Comment Pull Request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## CI Summary

            **Commit**

            `${{ github.sha }}`

            ### Trivy

            | Severity | Count |
            |----------|------:|
            | Critical | ${{ steps.ci.outputs.critical }} |
            | High | ${{ steps.ci.outputs.high }} |
            | Unfixed | ${{ steps.ci.outputs.unfixed }} |

            **SBOM Components**

            ${{ steps.ci.outputs.components }}

            ---

            ## AI Review

            ${{ steps.ai-review.outputs.report }}

      # ── Autolabel PR ──────────────────────────────────────────
      #   Automatically adds labels to the PR based on the title
      #   or branch name, which helps Release Drafter categorize it.

      - name: Autolabel Pull Request
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6
        continue-on-error: true
        with:
          disable-releaser: true
          commitish: ${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}