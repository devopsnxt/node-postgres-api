name: node-postgres-api Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: node-postgres-api-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: node-postgres-api
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/node-postgres-api

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: ${{ secrets.AI_API_KEY != '' }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || '' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || '' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || '' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if present)
        run: npm run lint --if-present

      - name: Run tests (if present)
        run: set -o pipefail; npm test --if-present 2>&1 | tee test-output.log

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npx snyk test --all-projects

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Validate SonarCloud configuration
        if: always()
        run: |
          set -euo pipefail
          test -n "$SONAR_HOST_URL" || { echo "SonarCloud host URL is missing"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "SonarCloud token is missing"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "SonarCloud organization repository variable is missing"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "SonarCloud project key is missing"; exit 1; }
          echo "SonarCloud host URL is configured: $SONAR_HOST_URL"
          echo "SonarCloud organization is configured: ${SONAR_ORGANIZATION:0:3}***"
          echo "SonarCloud project key is configured: ${SONAR_PROJECT_KEY:0:3}***"
          echo "SonarCloud token length: ${#SONAR_TOKEN}"

      - name: Run SonarCloud scan
        env:
          SONAR_SCANNER_JRE: ${{ steps.setup-java.outputs.java-home }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d # v5.0.0
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.login=${{ env.SONAR_TOKEN }}
            -Dsonar.sources=.
            -Dsonar.projectName=node-postgres-api
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Build Docker image for PR validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Generate SBOM from source
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: image-sbom.json

      - name: Scan repository filesystem with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: image-scan.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload image scan artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-scan-artifacts
          path: |
            image-sbom.json
            image-scan.json

      - name: Generate pipeline summary
        id: pipeline-summary
        if: always()
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length' image-scan.json 2>/dev/null || echo "n/a")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length' image-scan.json 2>/dev/null || echo "n/a")
          unfixed=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Status != "fixed")] | length' image-scan.json 2>/dev/null || echo "n/a")
          components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo "n/a")
          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          echo "high=$high" >> "$GITHUB_OUTPUT"
          echo "unfixed=$unfixed" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
          {
            echo "## Pipeline summary"
            echo ""
            echo "| Area | Result |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Docker image | \`${GHCR_IMAGE}:${GITHUB_SHA}\` (PR validation only) |"
            echo "| Trivy critical findings | $critical |"
            echo "| Trivy high findings | $high |"
            echo "| Trivy unfixed findings | $unfixed |"
            echo "| SBOM components | $components |"
            echo "| Image scan artifacts | Uploaded as \`image-scan-artifacts\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline summary: Trivy critical=$critical, high=$high, unfixed=$unfixed, SBOM components=$components"

      - name: Generate AI pipeline report
        id: ai-report
        if: ${{ env.AI_ENABLED == 'true' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only "$BASE_SHA...$GITHUB_SHA" -- '*.js' '*.json' '*.yml' '*.yaml' 'Dockerfile' '*.test.*' '*.spec.*' || true)
          review_context=''
          while IFS= read -r changed_file; do
            [ -n "$changed_file" ] || continue
            case "$changed_file" in
              package.json|package-lock.json|Dockerfile|.github/workflows/*.yml|.github/workflows/*.yaml|*.js|*.test.*|*.spec.*)
                file_content=$(git show "$GITHUB_SHA:$changed_file" 2>/dev/null || true)
                file_content=$(printf '%s' "$file_content" | sed -E 's/(password|token|secret|api[_-]?key|private[_-]?key)[^[:space:]=]*[[:space:]]*=[[:space:]]*[^[:space:]]+/\1=<REDACTED>/Ig')
                review_context="$review_context\n\n===== $changed_file =====\n$file_content"
                ;;
            esac
          done <<< "$changed_files"
          review_context="${review_context:0:24000}"
          scan_summary=$(jq -c '{critical: ([.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length), high: ([.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length)}' image-scan.json 2>/dev/null || echo '{}')
          sbom_components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo 'unavailable')
          test_results=$(head -c 4000 test-output.log 2>/dev/null || echo 'unavailable')
          request=$(jq -n --arg model "$AI_MODEL" --arg context "$review_context" --arg scans "$scan_summary" --arg components "$sbom_components" --arg tests "$test_results" '{model: $model, temperature: 0.1, messages: [{role: "system", content: "You are performing a targeted, advisory code review. Return JSON only, with no Markdown fences or extra text. Use only supplied evidence. Do not invent files, line numbers, or findings. Every finding line must be a positive integer present in the supplied changed file. Never include secrets. Use exactly this schema: {summary:string, findings:[{severity:high|medium|low|info,file:string,line:integer,issue:string,recommendation:string}], testRecommendations:[string], releaseRisk:low|medium|high}. Use an empty findings array when there is no evidence."}, {role: "user", content: ("Review only the changed files and directly related reports below. Focus on bugs, auth, injection, secret exposure, unsafe Docker/workflow configuration, validation, tests, API/database risks.\n\nChanged files:\n" + $context + "\n\nTrivy summary: " + $scans + "\nSBOM components: " + $components + "\nTest output:\n" + $tests)}]}')
          response_file=$(mktemp)
          case "$AI_API_URL" in
            https://*) ;;
            *) echo "Refusing non-HTTPS AI provider URL"; exit 1 ;;
          esac
          set +e
          http_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 60 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $AI_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$request" "$AI_API_URL")
          curl_exit=$?
          set -e
          if [ "$curl_exit" -ne 0 ]; then http_status='000'; fi
          report=$(cat "$response_file")
          rm -f "$response_file"
          if [ "$http_status" = "200" ]; then
            ai_text=$(jq -r '.choices[0].message.content // empty' <<< "$report")
            if ! printf '%s' "$ai_text" | jq -e 'type == "object" and (.summary | type == "string") and (.findings | type == "array") and all(.findings[]; (.severity | IN("high", "medium", "low", "info")) and (.file | type == "string") and (.line | type == "number" and floor == . and . >= 1) and (.issue | type == "string") and (.recommendation | type == "string")) and (.testRecommendations | type == "array") and all(.testRecommendations[]; type == "string") and (.releaseRisk | IN("low", "medium", "high"))' >/dev/null 2>&1; then
              ai_text=''
              echo 'AI review unavailable: provider returned invalid JSON or schema.'
            fi
            if [ -n "$ai_text" ]; then
              while IFS=$'\t' read -r finding_file finding_line; do
                if [ ! -f "$finding_file" ] || [ "$finding_line" -gt "$(wc -l < "$finding_file")" ]; then
                  ai_text=''
                  echo "AI review unavailable: finding reference is invalid: ${finding_file}:${finding_line}"
                  break
                fi
              done < <(jq -r '.findings[] | [.file, .line] | @tsv' <<< "$ai_text")
            fi
          else
            provider_error=$(jq -r '.error.message // .message // "no provider error message"' <<< "$report" 2>/dev/null || echo 'unparseable provider response')
            ai_text=''
            echo "AI provider request failed: URL=$AI_API_URL MODEL=$AI_MODEL HTTP_STATUS=$http_status"
            echo "AI review unavailable: provider returned HTTP $http_status. $provider_error"
          fi
          if [ -z "$ai_text" ]; then
            ai_text='{"summary":"AI review unavailable.","findings":[],"testRecommendations":[],"releaseRisk":"low"}'
          fi
          review_summary=$(jq -r '.summary' <<< "$ai_text")
          review_risk=$(jq -r '.releaseRisk' <<< "$ai_text")
          review_markdown=$( {
            echo "## AI targeted review (advisory)"
            echo ""
            echo "**Summary:** $review_summary"
            echo ""
            echo "**Release risk:** $review_risk"
            echo ""
            echo "### Findings"
            jq -r 'if (.findings | length) == 0 then "No evidence-based findings." else .findings[] | "- **\(.severity)** [\(.file):\(.line)] \(.issue) Recommendation: \(.recommendation)" end' <<< "$ai_text"
            echo ""
            echo "### Test recommendations"
            jq -r 'if (.testRecommendations | length) == 0 then "None." else .testRecommendations[] | "- \(.)" end' <<< "$ai_text"
          } )
          printf '%s\n' "$review_markdown" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'report<<AI_REPORT_EOF'
            printf '%s\n' "$review_markdown"
            echo 'AI_REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment PR with build summary
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **node-postgres-api CI completed**

            - Commit: `${{ github.sha }}`
            - Build image: `${{ env.GHCR_IMAGE }}:${{ github.sha }}`
            - Tests: completed
            - Pipeline: pull request validation

            **Trivy filesystem scan**

            | Severity | Findings |
            |---|---:|
            | Critical | ${{ steps.pipeline-summary.outputs.critical }} |
            | High | ${{ steps.pipeline-summary.outputs.high }} |
            | Unfixed | ${{ steps.pipeline-summary.outputs.unfixed }} |

            SBOM components: ${{ steps.pipeline-summary.outputs.components }}
            Detailed results: download the `image-scan-artifacts` artifact from this workflow run.

            **AI pipeline report (advisory)**

            ${{ steps.ai-report.outputs.report }}

  fast-forward-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: ${{ secrets.AI_API_KEY != '' }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || '' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || '' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || '' }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if present)
        run: npm run lint --if-present

      - name: Run tests (if present)
        run: set -o pipefail; npm test --if-present 2>&1 | tee test-output.log

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npx snyk test --all-projects

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Validate SonarCloud configuration
        if: always()
        run: |
          set -euo pipefail
          test -n "$SONAR_HOST_URL" || { echo "SonarCloud host URL is missing"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "SonarCloud token is missing"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "SonarCloud organization repository variable is missing"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "SonarCloud project key is missing"; exit 1; }
          echo "SonarCloud host URL is configured: $SONAR_HOST_URL"
          echo "SonarCloud organization is configured: ${SONAR_ORGANIZATION:0:3}***"
          echo "SonarCloud project key is configured: ${SONAR_PROJECT_KEY:0:3}***"
          echo "SonarCloud token length: ${#SONAR_TOKEN}"

      - name: Debug SonarCloud secret visibility
        if: always()
        run: |
          set -euo pipefail
          echo "SONAR_HOST_URL=${SONAR_HOST_URL}"
          echo "SONAR_ORGANIZATION=${SONAR_ORGANIZATION:0:3}***"
          echo "SONAR_PROJECT_KEY=${SONAR_PROJECT_KEY:0:3}***"
          if [ -n "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN is present"
            echo "SONAR_TOKEN length=${#SONAR_TOKEN}"
          else
            echo "SONAR_TOKEN is missing or empty"
            exit 1
          fi

      - name: Run SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_SCANNER_JRE: ${{ steps.setup-java.outputs.java-home }}
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d # v5.0.0
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.projectName=node-postgres-api

      - name: Show SonarCloud statistics
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_BRANCH: ${{ github.ref_name }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          set -euo pipefail
          sonar_url="${SONAR_HOST_URL:-https://sonarcloud.io}"
          echo "Using Sonar URL: $sonar_url"
          report_file=".scannerwork/report-task.txt"
          test -f "$report_file"
          ce_task_url=$(sed -n 's/^ceTaskUrl=//p' "$report_file")
          echo "Task URL: $ce_task_url"
          test -n "$ce_task_url"
          case "$ce_task_url" in
            https://*) ;;
            *) echo "Refusing non-HTTPS SonarCloud task URL"; exit 1 ;;
          esac
          task_status="UNKNOWN"
          for attempt in {1..30}; do
            if ce_task=$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              --header "Authorization: Basic $(printf '%s:' "$SONAR_TOKEN" | base64 -w 0)" \
              "$ce_task_url" 2>/dev/null); then
              task_status=$(jq -r '.task.status // "UNKNOWN"' <<< "$ce_task")
              case "$task_status" in
                SUCCESS) break ;;
                FAILED|CANCELED)
                  echo "SonarCloud analysis task failed: $task_status"
                  exit 1
                  ;;
                *)
                  if [ "$attempt" -eq 30 ]; then
                    echo "Timed out waiting for SonarCloud analysis task: $task_status"
                    break
                  fi
                  sleep 5
                  ;;
              esac
            else
              echo "Warning: unable to query SonarCloud task status at attempt $attempt; continuing without task metrics."
              break
            fi
          done
          sonar_scope=(--data-urlencode "projectKey=$SONAR_PROJECT_KEY")
          measure_scope=(--data-urlencode "component=$SONAR_PROJECT_KEY")
          if [ -n "$SONAR_PULL_REQUEST" ]; then
            sonar_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
            measure_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
          else
            sonar_scope+=(--data-urlencode "branch=$SONAR_BRANCH")
            measure_scope+=(--data-urlencode "branch=$SONAR_BRANCH")
          fi
          auth_header="Authorization: Basic $(printf '%s:' "$SONAR_TOKEN" | base64 | tr -d '\n')"
          measures="{}"
          for attempt in {1..10}; do
            if measures=$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --header "$auth_header" \
              --get "$sonar_url/api/measures/component" \
              "${measure_scope[@]}" \
              --data-urlencode "metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc" 2>/dev/null); then
              if jq -e '.component' <<< "$measures" >/dev/null 2>&1; then
                break
              fi
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Warning: unable to fetch SonarCloud measures after retries; using placeholder values."
              measures="{}"
              break
            fi
            echo "Waiting for SonarCloud measures to become available (attempt $attempt/10)..."
            sleep 10
          done
          quality_gate="{}"
          for attempt in {1..10}; do
            if quality_gate=$(curl --proto '=https' --tlsv1.2 --silent --show-error \
              --header "$auth_header" \
              --get "$sonar_url/api/qualitygates/project_status" \
              "${sonar_scope[@]}" 2>/dev/null); then
              if jq -e '.projectStatus' <<< "$quality_gate" >/dev/null 2>&1; then
                break
              fi
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Warning: unable to fetch SonarCloud quality gate after retries; using placeholder values."
              quality_gate="{}"
              break
            fi
            echo "Waiting for SonarCloud quality gate to become available (attempt $attempt/10)..."
            sleep 10
          done
          metric() {
            jq -r --arg key "$1" '([.component.measures[]? | select(.metric == $key) | .value] | first) // "n/a"' <<< "$measures"
          }
          quality_status=$(jq -r '.projectStatus.status // "UNKNOWN"' <<< "$quality_gate")
          bugs=$(metric bugs)
          vulnerabilities=$(metric vulnerabilities)
          code_smells=$(metric code_smells)
          coverage=$(metric coverage)
          duplication=$(metric duplicated_lines_density)
          lines=$(metric ncloc)
          {
            echo "## SonarCloud statistics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Quality gate | $quality_status |"
            echo "| Bugs | $bugs |"
            echo "| Vulnerabilities | $vulnerabilities |"
            echo "| Code smells | $code_smells |"
            echo "| Coverage | ${coverage}% |"
            echo "| Duplicated lines | ${duplication}% |"
            echo "| Lines of code | $lines |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SonarCloud quality gate: $quality_status"
          echo "Bugs: $bugs | Vulnerabilities: $vulnerabilities | Code smells: $code_smells | Coverage: ${coverage}% | Duplicated lines: ${duplication}% | Lines: $lines"
          if [ "$quality_status" = "UNKNOWN" ]; then
            echo "SonarCloud quality gate status unavailable; continuing without failing the pipeline."
          elif [ "$quality_status" != "OK" ]; then
            echo "SonarCloud quality gate failed: $quality_status"
            exit 1
          fi

      - name: Build Docker image for release
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Generate SBOM from source
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: image-sbom.json

      - name: Scan repository filesystem with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: image-scan.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload image scan artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-scan-artifacts
          path: |
            image-sbom.json
            image-scan.json

      - name: Generate pipeline summary
        if: always()
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length' image-scan.json 2>/dev/null || echo "n/a")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length' image-scan.json 2>/dev/null || echo "n/a")
          unfixed=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Status != "fixed")] | length' image-scan.json 2>/dev/null || echo "n/a")
          components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo "n/a")
          image_digest="${IMAGE_DIGEST:-not available}"
          {
            echo "## Pipeline summary"
            echo ""
            echo "| Area | Result |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Docker image | \`${GHCR_IMAGE}@${image_digest}\` |"
            echo "| Trivy critical findings | $critical |"
            echo "| Trivy high findings | $high |"
            echo "| Trivy unfixed findings | $unfixed |"
            echo "| SBOM components | $components |"
            echo "| Image signature | Verified |"
            echo "| SBOM attestation | Verified |"
            echo "| Image scan artifacts | Uploaded as \`image-scan-artifacts\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline summary: digest=$image_digest, Trivy critical=$critical, high=$high, unfixed=$unfixed, SBOM components=$components"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign GHCR image and attach SBOM
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_YES: 'true'
        run: |
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub
          image_digest=$(docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${{ github.sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$image_digest"
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          image_ref="${{ env.GHCR_IMAGE }}@$image_digest"
          cosign sign --key env://COSIGN_PRIVATE_KEY "$image_ref"
          cosign attest --key env://COSIGN_PRIVATE_KEY --predicate image-sbom.json "$image_ref"
          cosign verify --key cosign.pub "$image_ref"
          cosign verify-attestation --key cosign.pub "$image_ref"

      - name: Generate AI release report
        if: ${{ env.AI_ENABLED == 'true' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only "$BASE_SHA...$GITHUB_SHA" || true)
          diff_text=$(git diff --no-ext-diff "$BASE_SHA...$GITHUB_SHA" -- . ':!package-lock.json' ':!*.lock' || true)
          diff_text=$(printf '%s' "$diff_text" | sed -E 's/(password|token|secret|api[_-]?key|private[_-]?key)[^[:space:]=]*[[:space:]]*=[[:space:]]*[^[:space:]]+/\1=<REDACTED>/Ig')
          diff_text="${diff_text:0:12000}"
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length' image-scan.json 2>/dev/null || echo 'unavailable')
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length' image-scan.json 2>/dev/null || echo 'unavailable')
          sbom_components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo 'unavailable')
          image_digest="${IMAGE_DIGEST:-not available}"
          test_results=$(head -c 4000 test-output.log 2>/dev/null || echo 'unavailable')
          request=$(jq -n --arg model "$AI_MODEL" --arg files "$changed_files" --arg diff "$diff_text" --arg critical "$critical" --arg high "$high" --arg components "$sbom_components" --arg digest "$image_digest" --arg tests "$test_results" '{model: $model, temperature: 0.1, messages: [{role: "system", content: "You are producing an advisory release-readiness assessment. Return JSON only, with no Markdown fences or extra text. Use only supplied evidence. Never invent values, files, migrations, or risks, and never include secrets. Deterministic facts marked authoritative must be copied exactly. Use exactly this schema: {readiness:pass|pass_with_warnings|manual_review|unavailable,summary:string,apiContractChange:yes|no|unknown,databaseMigration:yes|no|unknown,configurationChange:yes|no|unknown,authenticationChange:yes|no|unknown,dependencyUpgrade:yes|no|unknown,containerBaseImageChange:yes|no|unknown,rollbackConcern:low|medium|high|unknown,manualApprovalRequired:boolean,risks:[string],recommendedAction:string}."}, {role: "user", content: ("Assess release readiness. AI must not replace deterministic gates or production approval.\n\nAuthoritative deterministic facts:\nTrivy critical vulnerabilities: " + $critical + "\nTrivy high vulnerabilities: " + $high + "\nSBOM components: " + $components + "\nImage digest: " + $digest + "\nImage signature verification: passed\nSBOM attestation verification: passed\n\nChanged files:\n" + $files + "\n\nTest output:\n" + $tests + "\n\nRedacted diff:\n" + $diff)}]}')
          response_file=$(mktemp)
          case "$AI_API_URL" in
            https://*) ;;
            *) echo "Refusing non-HTTPS AI provider URL"; exit 1 ;;
          esac
          set +e
          http_status=$(curl --proto '=https' --tlsv1.2 --silent --show-error --max-time 60 --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer $AI_API_KEY" --header 'Content-Type: application/json' --data "$request" "$AI_API_URL")
          curl_exit=$?
          set -e
          if [ "$curl_exit" -ne 0 ]; then http_status='000'; fi
          report=$(cat "$response_file")
          rm -f "$response_file"
          if [ "$http_status" = "200" ]; then
            ai_text=$(jq -r '.choices[0].message.content // empty' <<< "$report")
            if ! printf '%s' "$ai_text" | jq -e 'type == "object" and (.readiness | IN("pass", "pass_with_warnings", "manual_review", "unavailable")) and (.summary | type == "string") and (.apiContractChange | IN("yes", "no", "unknown")) and (.databaseMigration | IN("yes", "no", "unknown")) and (.configurationChange | IN("yes", "no", "unknown")) and (.authenticationChange | IN("yes", "no", "unknown")) and (.dependencyUpgrade | IN("yes", "no", "unknown")) and (.containerBaseImageChange | IN("yes", "no", "unknown")) and (.rollbackConcern | IN("low", "medium", "high", "unknown")) and (.manualApprovalRequired | type == "boolean") and (.risks | type == "array") and all(.risks[]; type == "string") and (.recommendedAction | type == "string")' >/dev/null 2>&1; then
              ai_text=''
              echo 'AI release assessment unavailable: provider returned invalid JSON or schema.'
            fi
          else
            provider_error=$(jq -r '.error.message // .message // "no provider error message"' <<< "$report" 2>/dev/null || echo 'unparseable provider response')
            ai_text=''
            echo "AI provider request failed: URL=$AI_API_URL MODEL=$AI_MODEL HTTP_STATUS=$http_status"
            echo "AI release assessment unavailable: provider returned HTTP $http_status. $provider_error"
          fi
          if [ -z "$ai_text" ]; then
            ai_text='{"readiness":"unavailable","summary":"AI release assessment unavailable.","apiContractChange":"unknown","databaseMigration":"unknown","configurationChange":"unknown","authenticationChange":"unknown","dependencyUpgrade":"unknown","containerBaseImageChange":"unknown","rollbackConcern":"unknown","manualApprovalRequired":true,"risks":["AI assessment unavailable; review deterministic reports and release gates manually."],"recommendedAction":"Do not use this report as release approval; follow normal deterministic gates and human approval."}'
          fi
          readiness=$(jq -r '.readiness' <<< "$ai_text")
          summary=$(jq -r '.summary' <<< "$ai_text")
          {
            echo "## AI release intelligence (advisory)"
            echo ""
            echo "**Release readiness:** $readiness"
            echo ""
            echo "**Summary:** $summary"
            echo ""
            echo "| Check | Assessment |"
            echo "|---|---|"
            echo "| Tests | Deterministic checks completed before release assessment |"
            echo "| Trivy critical vulnerabilities | $critical |"
            echo "| Trivy high vulnerabilities | $high |"
            echo "| SBOM components | $sbom_components |"
            echo "| Image signature | Verified |"
            echo "| SBOM attestation | Verified |"
            echo "| API contract change | $(jq -r '.apiContractChange' <<< "$ai_text") |"
            echo "| Database migration | $(jq -r '.databaseMigration' <<< "$ai_text") |"
            echo "| Configuration change | $(jq -r '.configurationChange' <<< "$ai_text") |"
            echo "| Authentication change | $(jq -r '.authenticationChange' <<< "$ai_text") |"
            echo "| Dependency upgrade | $(jq -r '.dependencyUpgrade' <<< "$ai_text") |"
            echo "| Container base-image change | $(jq -r '.containerBaseImageChange' <<< "$ai_text") |"
            echo "| Rollback concern | $(jq -r '.rollbackConcern' <<< "$ai_text") |"
            echo "| Manual approval required | $(jq -r '.manualApprovalRequired' <<< "$ai_text") |"
            echo ""
            echo "**Risks:**"
            jq -r 'if (.risks | length) == 0 then "None reported." else .risks[] | "- \(.)" end' <<< "$ai_text"
            echo ""
            echo "**Recommended action:** $(jq -r '.recommendedAction' <<< "$ai_text")"
            echo ""
            echo "AI is advisory and does not replace deterministic gates or production approval."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: ${{ success() }}
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          body: |
            Release version: `${{ github.sha }}`
            Published image: `${{ env.GHCR_IMAGE }}:${{ github.sha }}`
            Released by GitHub Actions pipeline.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
