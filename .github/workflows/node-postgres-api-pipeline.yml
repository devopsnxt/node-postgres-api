name: node-postgres-api Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: node-postgres-api-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: node-postgres-api
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/node-postgres-api

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: ${{ secrets.AI_API_KEY != '' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if present)
        run: npm run lint --if-present

      - name: Run tests (if present)
        run: set -o pipefail; npm test --if-present 2>&1 | tee test-output.log

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npx snyk test --all-projects

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Run SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_SCANNER_JRE: ${{ steps.setup-java.outputs.java-home }}
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.projectName=node-postgres-api

      - name: Show SonarCloud statistics
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sonar_url="https://sonarcloud.io"
          report_file=".scannerwork/report-task.txt"
          test -f "$report_file"
          ce_task_url=$(sed -n 's/^ceTaskUrl=//p' "$report_file")
          test -n "$ce_task_url"
          for attempt in {1..30}; do
            ce_task=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" "$ce_task_url")
            ce_status=$(jq -r '.task.status' <<< "$ce_task")
            case "$ce_status" in
              SUCCESS) break ;;
              FAILED|CANCELED)
                echo "SonarCloud analysis task failed: $ce_status"
                exit 1
                ;;
              *)
                if [ "$attempt" -eq 30 ]; then
                  echo "Timed out waiting for SonarCloud analysis task: $ce_status"
                  exit 1
                fi
                sleep 5
                ;;
            esac
          done
          sonar_scope=(--data-urlencode "projectKey=$SONAR_PROJECT_KEY")
          measure_scope=(--data-urlencode "component=$SONAR_PROJECT_KEY")
          if [ -n "$SONAR_PULL_REQUEST" ]; then
            sonar_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
            measure_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
          else
            sonar_scope+=(--data-urlencode "branch=$SONAR_BRANCH")
            measure_scope+=(--data-urlencode "branch=$SONAR_BRANCH")
          fi
          measures=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$sonar_url/api/measures/component" \
            "${measure_scope[@]}" \
            --data-urlencode "metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc")
          quality_gate=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$sonar_url/api/qualitygates/project_status" \
            "${sonar_scope[@]}")
          metric() {
            jq -r --arg key "$1" '([.component.measures[]? | select(.metric == $key) | .value] | first) // "n/a"' <<< "$measures"
          }
          quality_status=$(jq -r '.projectStatus.status // "UNKNOWN"' <<< "$quality_gate")
          bugs=$(metric bugs)
          vulnerabilities=$(metric vulnerabilities)
          code_smells=$(metric code_smells)
          coverage=$(metric coverage)
          duplication=$(metric duplicated_lines_density)
          lines=$(metric ncloc)
          {
            echo "## SonarCloud statistics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Quality gate | $quality_status |"
            echo "| Bugs | $bugs |"
            echo "| Vulnerabilities | $vulnerabilities |"
            echo "| Code smells | $code_smells |"
            echo "| Coverage | ${coverage}% |"
            echo "| Duplicated lines | ${duplication}% |"
            echo "| Lines of code | $lines |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SonarCloud quality gate: $quality_status"
          echo "Bugs: $bugs | Vulnerabilities: $vulnerabilities | Code smells: $code_smells | Coverage: ${coverage}% | Duplicated lines: ${duplication}% | Lines: $lines"
          if [ "$quality_status" != "OK" ]; then
            echo "SonarCloud quality gate failed: $quality_status"
            exit 1
          fi

      - name: Build Docker image for PR validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Install syft and trivy
        run: |
          set -eux
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM from source
        run: |
          syft dir:. -o cyclonedx-json=./image-sbom.json

      - name: Scan repository filesystem with Trivy
        run: |
          trivy fs --format json --output image-scan.json --severity HIGH,CRITICAL --ignore-unfixed .

      - name: Upload image scan artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-scan-artifacts
          path: |
            image-sbom.json
            image-scan.json

      - name: Generate pipeline summary
        id: pipeline-summary
        if: always()
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length' image-scan.json 2>/dev/null || echo "n/a")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length' image-scan.json 2>/dev/null || echo "n/a")
          unfixed=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Status != "fixed")] | length' image-scan.json 2>/dev/null || echo "n/a")
          components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo "n/a")
          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          echo "high=$high" >> "$GITHUB_OUTPUT"
          echo "unfixed=$unfixed" >> "$GITHUB_OUTPUT"
          echo "components=$components" >> "$GITHUB_OUTPUT"
          {
            echo "## Pipeline summary"
            echo ""
            echo "| Area | Result |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Docker image | \`${GHCR_IMAGE}:${GITHUB_SHA}\` (PR validation only) |"
            echo "| Trivy critical findings | $critical |"
            echo "| Trivy high findings | $high |"
            echo "| Trivy unfixed findings | $unfixed |"
            echo "| SBOM components | $components |"
            echo "| Image scan artifacts | Uploaded as \`image-scan-artifacts\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline summary: Trivy critical=$critical, high=$high, unfixed=$unfixed, SBOM components=$components"

      - name: Generate AI pipeline report
        id: ai-report
        if: ${{ env.AI_ENABLED == 'true' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          diff_text=$(git diff --no-ext-diff "$BASE_SHA...$GITHUB_SHA" -- . ':!package-lock.json' ':!*.lock' | head -c 12000 || true)
          diff_text=$(printf '%s' "$diff_text" | sed -E 's/(password|token|secret|api[_-]?key|private[_-]?key)[^[:space:]=]*[[:space:]]*=[[:space:]]*[^[:space:]]+/\1=<REDACTED>/Ig')
          scan_summary=$(jq -c '{critical: ([.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length), high: ([.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length)}' image-scan.json 2>/dev/null || echo '{}')
          sbom_components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo 'unavailable')
          test_results=$(head -c 4000 test-output.log 2>/dev/null || echo 'unavailable')
          request=$(jq -n --arg model "$AI_MODEL" --arg diff "$diff_text" --arg scans "$scan_summary" --arg components "$sbom_components" --arg tests "$test_results" '{model: $model, temperature: 0.1, messages: [{role: "system", content: "You are a CI/CD assistant. Produce a concise advisory report in Markdown. Use only the supplied evidence. Do not invent findings, file names, or line numbers. Never include secrets."}, {role: "user", content: ("Summarize this pipeline run. Include: what changed, likely risks, missing tests, and recommended next action. Mark unavailable data clearly.\n\nSecurity counts: " + $scans + "\nSBOM components: " + $components + "\n\nTest output:\n" + $tests + "\n\nDiff:\n" + $diff)}]}')
          response_file=$(mktemp)
          set +e
          http_status=$(curl --silent --show-error --max-time 60 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $AI_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "$request" "$AI_API_URL")
          curl_exit=$?
          set -e
          if [ "$curl_exit" -ne 0 ]; then http_status='000'; fi
          report=$(cat "$response_file")
          rm -f "$response_file"
          if [ "$http_status" = "200" ]; then
            ai_text=$(jq -r '.choices[0].message.content // empty' <<< "$report")
          else
            provider_error=$(jq -r '.error.message // .message // "no provider error message"' <<< "$report" 2>/dev/null || echo 'unparseable provider response')
            ai_text="AI report unavailable: provider returned HTTP $http_status. $provider_error"
            echo "AI provider request failed: URL=$AI_API_URL MODEL=$AI_MODEL HTTP_STATUS=$http_status"
          fi
          if [ -z "$ai_text" ]; then
            ai_text='AI report unavailable: the provider returned no report.'
          fi
          {
            echo "## AI pipeline report (advisory)"
            echo ""
            printf '%s\n' "$ai_text"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'report<<AI_REPORT_EOF'
            printf '%s\n' "$ai_text"
            echo 'AI_REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Comment PR with build summary
        uses: peter-evans/create-or-update-comment@v4
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **node-postgres-api CI completed**

            - Commit: `${{ github.sha }}`
            - Build image: `${{ env.GHCR_IMAGE }}:${{ github.sha }}`
            - Tests: completed
            - Pipeline: pull request validation

            **Trivy filesystem scan**

            | Severity | Findings |
            |---|---:|
            | Critical | ${{ steps.pipeline-summary.outputs.critical }} |
            | High | ${{ steps.pipeline-summary.outputs.high }} |
            | Unfixed | ${{ steps.pipeline-summary.outputs.unfixed }} |

            SBOM components: ${{ steps.pipeline-summary.outputs.components }}
            Detailed results: download the `image-scan-artifacts` artifact from this workflow run.

            **AI pipeline report (advisory)**

            ${{ steps.ai-report.outputs.report }}

  fast-forward-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: ${{ secrets.AI_API_KEY != '' }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if present)
        run: npm run lint --if-present

      - name: Run tests (if present)
        run: set -o pipefail; npm test --if-present 2>&1 | tee test-output.log

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npx snyk test --all-projects

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Run SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_SCANNER_JRE: ${{ steps.setup-java.outputs.java-home }}
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.projectName=node-postgres-api

      - name: Show SonarCloud statistics
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sonar_url="https://sonarcloud.io"
          report_file=".scannerwork/report-task.txt"
          test -f "$report_file"
          ce_task_url=$(sed -n 's/^ceTaskUrl=//p' "$report_file")
          test -n "$ce_task_url"
          for attempt in {1..30}; do
            ce_task=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" "$ce_task_url")
            ce_status=$(jq -r '.task.status' <<< "$ce_task")
            case "$ce_status" in
              SUCCESS) break ;;
              FAILED|CANCELED)
                echo "SonarCloud analysis task failed: $ce_status"
                exit 1
                ;;
              *)
                if [ "$attempt" -eq 30 ]; then
                  echo "Timed out waiting for SonarCloud analysis task: $ce_status"
                  exit 1
                fi
                sleep 5
                ;;
            esac
          done
          sonar_scope=(--data-urlencode "projectKey=$SONAR_PROJECT_KEY")
          measure_scope=(--data-urlencode "component=$SONAR_PROJECT_KEY")
          if [ -n "$SONAR_PULL_REQUEST" ]; then
            sonar_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
            measure_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
          else
            sonar_scope+=(--data-urlencode "branch=$SONAR_BRANCH")
            measure_scope+=(--data-urlencode "branch=$SONAR_BRANCH")
          fi
          measures=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$sonar_url/api/measures/component" \
            "${measure_scope[@]}" \
            --data-urlencode "metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc")
          quality_gate=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$sonar_url/api/qualitygates/project_status" \
            "${sonar_scope[@]}")
          metric() {
            jq -r --arg key "$1" '([.component.measures[]? | select(.metric == $key) | .value] | first) // "n/a"' <<< "$measures"
          }
          quality_status=$(jq -r '.projectStatus.status // "UNKNOWN"' <<< "$quality_gate")
          bugs=$(metric bugs)
          vulnerabilities=$(metric vulnerabilities)
          code_smells=$(metric code_smells)
          coverage=$(metric coverage)
          duplication=$(metric duplicated_lines_density)
          lines=$(metric ncloc)
          {
            echo "## SonarCloud statistics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Quality gate | $quality_status |"
            echo "| Bugs | $bugs |"
            echo "| Vulnerabilities | $vulnerabilities |"
            echo "| Code smells | $code_smells |"
            echo "| Coverage | ${coverage}% |"
            echo "| Duplicated lines | ${duplication}% |"
            echo "| Lines of code | $lines |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SonarCloud quality gate: $quality_status"
          echo "Bugs: $bugs | Vulnerabilities: $vulnerabilities | Code smells: $code_smells | Coverage: ${coverage}% | Duplicated lines: ${duplication}% | Lines: $lines"
          if [ "$quality_status" != "OK" ]; then
            echo "SonarCloud quality gate failed: $quality_status"
            exit 1
          fi

      - name: Build Docker image for release
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Install syft and trivy
        run: |
          set -eux
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM from source
        run: |
          syft dir:. -o cyclonedx-json=./image-sbom.json

      - name: Scan repository filesystem with Trivy
        run: |
          trivy fs --format json --output image-scan.json --severity HIGH,CRITICAL --ignore-unfixed .

      - name: Upload image scan artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-scan-artifacts
          path: |
            image-sbom.json
            image-scan.json

      - name: Generate pipeline summary
        if: always()
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length' image-scan.json 2>/dev/null || echo "n/a")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length' image-scan.json 2>/dev/null || echo "n/a")
          unfixed=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Status != "fixed")] | length' image-scan.json 2>/dev/null || echo "n/a")
          components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo "n/a")
          image_digest="${IMAGE_DIGEST:-not available}"
          {
            echo "## Pipeline summary"
            echo ""
            echo "| Area | Result |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Docker image | \`${GHCR_IMAGE}@${image_digest}\` |"
            echo "| Trivy critical findings | $critical |"
            echo "| Trivy high findings | $high |"
            echo "| Trivy unfixed findings | $unfixed |"
            echo "| SBOM components | $components |"
            echo "| Image signature | Verified |"
            echo "| SBOM attestation | Verified |"
            echo "| Image scan artifacts | Uploaded as \`image-scan-artifacts\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline summary: digest=$image_digest, Trivy critical=$critical, high=$high, unfixed=$unfixed, SBOM components=$components"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign GHCR image and attach SBOM
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_YES: 'true'
        run: |
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub
          image_digest=$(docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${{ github.sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$image_digest"
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          image_ref="${{ env.GHCR_IMAGE }}@$image_digest"
          cosign sign --key env://COSIGN_PRIVATE_KEY "$image_ref"
          cosign attest --key env://COSIGN_PRIVATE_KEY --predicate image-sbom.json "$image_ref"
          cosign verify --key cosign.pub "$image_ref"
          cosign verify-attestation --key cosign.pub "$image_ref"

      - name: Generate AI release report
        if: ${{ env.AI_ENABLED == 'true' }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ vars.AI_API_URL || 'https://api.groq.com/openai/v1/chat/completions' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          diff_text=$(git diff --no-ext-diff "$BASE_SHA...$GITHUB_SHA" -- . ':!package-lock.json' ':!*.lock' | head -c 12000 || true)
          diff_text=$(printf '%s' "$diff_text" | sed -E 's/(password|token|secret|api[_-]?key|private[_-]?key)[^[:space:]=]*[[:space:]]*=[[:space:]]*[^[:space:]]+/\1=<REDACTED>/Ig')
          scan_summary=$(jq -c '{critical: ([.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length), high: ([.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length)}' image-scan.json 2>/dev/null || echo '{}')
          sbom_components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo 'unavailable')
          image_digest="${IMAGE_DIGEST:-not available}"
          test_results=$(head -c 4000 test-output.log 2>/dev/null || echo 'unavailable')
          request=$(jq -n --arg model "$AI_MODEL" --arg diff "$diff_text" --arg scans "$scan_summary" --arg components "$sbom_components" --arg digest "$image_digest" --arg tests "$test_results" '{model: $model, temperature: 0.1, messages: [{role: "system", content: "You are a CI/CD assistant. Produce a concise advisory release report in Markdown. Use only the supplied evidence. Do not invent findings. Never include secrets."}, {role: "user", content: ("Summarize release readiness. Include what changed, security risk, rollback concerns, and recommended next action. Mark unavailable data clearly.\n\nSecurity counts: " + $scans + "\nSBOM components: " + $components + "\nImage digest: " + $digest + "\nSignature and SBOM attestation: verified\n\nTest output:\n" + $tests + "\n\nDiff:\n" + $diff)}]}')
          response_file=$(mktemp)
          set +e
          http_status=$(curl --silent --show-error --max-time 60 --output "$response_file" --write-out '%{http_code}' --header "Authorization: Bearer $AI_API_KEY" --header 'Content-Type: application/json' --data "$request" "$AI_API_URL")
          curl_exit=$?
          set -e
          if [ "$curl_exit" -ne 0 ]; then http_status='000'; fi
          report=$(cat "$response_file")
          rm -f "$response_file"
          if [ "$http_status" = "200" ]; then
            ai_text=$(jq -r '.choices[0].message.content // empty' <<< "$report")
          else
            provider_error=$(jq -r '.error.message // .message // "no provider error message"' <<< "$report" 2>/dev/null || echo 'unparseable provider response')
            ai_text="AI release report unavailable: provider returned HTTP $http_status. $provider_error"
            echo "AI provider request failed: URL=$AI_API_URL MODEL=$AI_MODEL HTTP_STATUS=$http_status"
          fi
          if [ -z "$ai_text" ]; then
            ai_text='AI release report unavailable: the provider returned no report.'
          fi
          {
            echo "## AI release report (advisory)"
            echo ""
            printf '%s\n' "$ai_text"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          body: |
            Release version: `${{ github.sha }}`
            Published image: `${{ env.GHCR_IMAGE }}:${{ github.sha }}`
            Released by GitHub Actions pipeline.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
