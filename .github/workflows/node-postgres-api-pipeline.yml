name: node-postgres-api Pipeline

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

env:
  APP_NAME: node-postgres-api
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/node-postgres-api

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if present)
        run: npm run lint --if-present

      - name: Run tests (if present)
        run: npm test --if-present

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npx snyk test --all-projects

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Run SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_SCANNER_JRE: ${{ steps.setup-java.outputs.java-home }}
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.projectName=node-postgres-api

      - name: Show SonarCloud statistics
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sonar_url="https://sonarcloud.io"
          sonar_scope=(--data-urlencode "projectKey=$SONAR_PROJECT_KEY")
          measure_scope=(--data-urlencode "component=$SONAR_PROJECT_KEY")
          if [ -n "$SONAR_PULL_REQUEST" ]; then
            sonar_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
            measure_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
          fi
          measures=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$sonar_url/api/measures/component" \
            "${measure_scope[@]}" \
            --data-urlencode "metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc")
          quality_gate=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$sonar_url/api/qualitygates/project_status" \
            "${sonar_scope[@]}")
          metric() {
            jq -r --arg key "$1" '([.component.measures[]? | select(.metric == $key) | .value] | first) // "n/a"' <<< "$measures"
          }
          quality_status=$(jq -r '.projectStatus.status // "UNKNOWN"' <<< "$quality_gate")
          bugs=$(metric bugs)
          vulnerabilities=$(metric vulnerabilities)
          code_smells=$(metric code_smells)
          coverage=$(metric coverage)
          duplication=$(metric duplicated_lines_density)
          lines=$(metric ncloc)
          {
            echo "## SonarCloud statistics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Quality gate | $quality_status |"
            echo "| Bugs | $bugs |"
            echo "| Vulnerabilities | $vulnerabilities |"
            echo "| Code smells | $code_smells |"
            echo "| Coverage | ${coverage}% |"
            echo "| Duplicated lines | ${duplication}% |"
            echo "| Lines of code | $lines |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SonarCloud quality gate: $quality_status"
          echo "Bugs: $bugs | Vulnerabilities: $vulnerabilities | Code smells: $code_smells | Coverage: ${coverage}% | Duplicated lines: ${duplication}% | Lines: $lines"
          if [ "$quality_status" != "OK" ]; then
            echo "SonarCloud quality gate failed: $quality_status"
            exit 1
          fi

      - name: Build Docker image for PR validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Install syft and trivy
        run: |
          set -eux
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM from source
        run: |
          syft dir:. -o cyclonedx-json=./image-sbom.json

      - name: Scan repository filesystem with Trivy
        run: |
          trivy fs --format json --output image-scan.json --severity HIGH,CRITICAL --ignore-unfixed .

      - name: Upload image scan artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-scan-artifacts
          path: |
            image-sbom.json
            image-scan.json

      - name: Generate pipeline summary
        if: always()
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length' image-scan.json 2>/dev/null || echo "n/a")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length' image-scan.json 2>/dev/null || echo "n/a")
          unfixed=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Status != "fixed")] | length' image-scan.json 2>/dev/null || echo "n/a")
          components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo "n/a")
          {
            echo "## Pipeline summary"
            echo ""
            echo "| Area | Result |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Docker image | \`${GHCR_IMAGE}:${GITHUB_SHA}\` (PR validation only) |"
            echo "| Trivy critical findings | $critical |"
            echo "| Trivy high findings | $high |"
            echo "| Trivy unfixed findings | $unfixed |"
            echo "| SBOM components | $components |"
            echo "| Image scan artifacts | Uploaded as \`image-scan-artifacts\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline summary: Trivy critical=$critical, high=$high, unfixed=$unfixed, SBOM components=$components"

      - name: Comment PR with build summary
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **node-postgres-api CI completed**

            - Commit: `${{ github.sha }}`
            - Build image: `${{ env.GHCR_IMAGE }}:${{ github.sha }}`
            - Tests: completed
            - Pipeline: pull request validation

  fast-forward-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if present)
        run: npm run lint --if-present

      - name: Run tests (if present)
        run: npm test --if-present

      - name: Run Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        if: ${{ env.SNYK_TOKEN != '' }}
        run: |
          npx snyk test --all-projects

      - name: Set up Java 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Run SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_SCANNER_JRE: ${{ steps.setup-java.outputs.java-home }}
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: .
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.projectName=node-postgres-api

      - name: Show SonarCloud statistics
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          sonar_url="https://sonarcloud.io"
          sonar_scope=(--data-urlencode "projectKey=$SONAR_PROJECT_KEY")
          measure_scope=(--data-urlencode "component=$SONAR_PROJECT_KEY")
          if [ -n "$SONAR_PULL_REQUEST" ]; then
            sonar_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
            measure_scope+=(--data-urlencode "pullRequest=$SONAR_PULL_REQUEST")
          fi
          measures=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$sonar_url/api/measures/component" \
            "${measure_scope[@]}" \
            --data-urlencode "metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc")
          quality_gate=$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$sonar_url/api/qualitygates/project_status" \
            "${sonar_scope[@]}")
          metric() {
            jq -r --arg key "$1" '([.component.measures[]? | select(.metric == $key) | .value] | first) // "n/a"' <<< "$measures"
          }
          quality_status=$(jq -r '.projectStatus.status // "UNKNOWN"' <<< "$quality_gate")
          bugs=$(metric bugs)
          vulnerabilities=$(metric vulnerabilities)
          code_smells=$(metric code_smells)
          coverage=$(metric coverage)
          duplication=$(metric duplicated_lines_density)
          lines=$(metric ncloc)
          {
            echo "## SonarCloud statistics"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Quality gate | $quality_status |"
            echo "| Bugs | $bugs |"
            echo "| Vulnerabilities | $vulnerabilities |"
            echo "| Code smells | $code_smells |"
            echo "| Coverage | ${coverage}% |"
            echo "| Duplicated lines | ${duplication}% |"
            echo "| Lines of code | $lines |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SonarCloud quality gate: $quality_status"
          echo "Bugs: $bugs | Vulnerabilities: $vulnerabilities | Code smells: $code_smells | Coverage: ${coverage}% | Duplicated lines: ${duplication}% | Lines: $lines"
          if [ "$quality_status" != "OK" ]; then
            echo "SonarCloud quality gate failed: $quality_status"
            exit 1
          fi

      - name: Build Docker image for release
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Install syft and trivy
        run: |
          set -eux
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM from source
        run: |
          syft dir:. -o cyclonedx-json=./image-sbom.json

      - name: Scan repository filesystem with Trivy
        run: |
          trivy fs --format json --output image-scan.json --severity HIGH,CRITICAL --ignore-unfixed .

      - name: Upload image scan artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-scan-artifacts
          path: |
            image-sbom.json
            image-scan.json

      - name: Generate pipeline summary
        if: always()
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "CRITICAL")] | length' image-scan.json 2>/dev/null || echo "n/a")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.severity == "HIGH")] | length' image-scan.json 2>/dev/null || echo "n/a")
          unfixed=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Status != "fixed")] | length' image-scan.json 2>/dev/null || echo "n/a")
          components=$(jq '.components | length' image-sbom.json 2>/dev/null || echo "n/a")
          image_digest="${IMAGE_DIGEST:-not available}"
          {
            echo "## Pipeline summary"
            echo ""
            echo "| Area | Result |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| Docker image | \`${GHCR_IMAGE}@${image_digest}\` |"
            echo "| Trivy critical findings | $critical |"
            echo "| Trivy high findings | $high |"
            echo "| Trivy unfixed findings | $unfixed |"
            echo "| SBOM components | $components |"
            echo "| Image signature | Verified |"
            echo "| SBOM attestation | Verified |"
            echo "| Image scan artifacts | Uploaded as \`image-scan-artifacts\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline summary: digest=$image_digest, Trivy critical=$critical, high=$high, unfixed=$unfixed, SBOM components=$components"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ${{ env.GHCR_IMAGE }}:${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign GHCR image and attach SBOM
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_YES: 'true'
        run: |
          cosign public-key --key env://COSIGN_PRIVATE_KEY > cosign.pub
          image_digest=$(docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${{ github.sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$image_digest"
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          image_ref="${{ env.GHCR_IMAGE }}@$image_digest"
          cosign sign --key env://COSIGN_PRIVATE_KEY "$image_ref"
          cosign attest --key env://COSIGN_PRIVATE_KEY --predicate image-sbom.json "$image_ref"
          cosign verify --key cosign.pub "$image_ref"
          cosign verify-attestation --key cosign.pub "$image_ref"

      - name: Create GitHub release
        if: ${{ success() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          body: |
            Release version: `${{ github.sha }}`
            Published image: `${{ env.GHCR_IMAGE }}:${{ github.sha }}`
            Released by GitHub Actions pipeline.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
